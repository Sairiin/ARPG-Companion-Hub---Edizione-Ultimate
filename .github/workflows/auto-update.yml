name: Auto-Update ARPG Meta

# 1. Quando deve girare questo script?
on:
  schedule:
    # Gira ogni giorno alle 00:00 UTC
    - cron: '0 0 * * *'
  # Permette di avviare l'aggiornamento anche manualmente tramite un bottone su GitHub
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Permesso necessario per salvare i file sul repository

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Installa le dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Esegui lo script di estrazione dati
        run: python scripts/update_data.py

      - name: Salva i cambiamenti (Commit & Push)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Auto-update: Build e Meta aggiornati"
          file_pattern: assets/*.json
