<div class="d4-sub-nav sub-tabs-container">
    <button class="d4-sub-btn sub-tab-btn active-sub" onclick="openSubTab(event, 'd4-dash', 'd4')">📊 Dashboard</button>
    <button class="d4-sub-btn sub-tab-btn" onclick="openSubTab(event, 'd4-tools', 'd4')">🧰 Strumenti</button>
    <button class="d4-sub-btn sub-tab-btn" onclick="openSubTab(event, 'd4-builds', 'd4')">💾 Le Mie Build</button>
</div>

<div id="d4-dash" class="d4-sub-content active-sub-content">
    <div id="build-meta-d4" class="build-meta-panel"></div>
    
    <div class="dash-grid">
        <div class="dash-card">
            <h3>🛡️ Top Build Endgame <span class="tag season-highlight">Caricamento...</span></h3>
            <ul id="top-builds-d4" class="dash-list">
                <li><span style="color: var(--text-muted); font-style:italic;">In attesa di sincronizzazione...</span></li>
            </ul>
        </div>
        <div class="dash-card">
            <h3>🚀 Top Build Leveling <span class="tag season-highlight">Caricamento...</span></h3>
            <ul id="top-leveling-d4" class="dash-list">
                <li><span style="color: var(--text-muted); font-style:italic;">In attesa di sincronizzazione...</span></li>
            </ul>
        </div>
    </div>
    
    <div id="build-discovery-d4" class="build-discovery-panel"></div>
</div>

<div id="d4-tools" class="d4-sub-content" style="display:none;">
    <div class="tools-grid">
        <button class="tool-card" onclick="openOverlay('https://d4builds.gg', 'D4Builds.gg')">🗺️ D4Builds</button>
        <button class="tool-card" onclick="openOverlay('https://maxroll.gg/d4', 'Maxroll D4')">📖 Maxroll D4</button>
        <button class="tool-card" onclick="openOverlay('https://mobalytics.gg/diablo-4', 'Mobalytics D4')">📊 Mobalytics D4</button>
    </div>
</div>

<div id="d4-builds" class="d4-sub-content" style="display:none;">
    <div class="my-builds-container">
        <h3>💾 Salva la tua Build Diablo 4</h3>
        <form id="form-d4" onsubmit="saveBuild(event, 'd4')" class="build-form">
            <input type="text" id="name-d4" placeholder="Nome Build" required>
            <input type="url" id="link-d4" placeholder="Link Guida" required>
            <input type="text" id="version-d4" placeholder="Stagione">
            <input type="text" id="note-d4" placeholder="Note">
            <div class="form-actions">
                <button type="submit" id="submit-btn-d4" class="submit-btn" style="background:#c0392b;">Salva</button>
                <button type="button" id="cancel-btn-d4" class="cancel-btn" style="display:none;" onclick="cancelEdit('d4')">Annulla</button>
            </div>
        </form>
        <input type="text" id="filter-saved-d4" placeholder="🔍 Cerca tra le mie build..." onkeyup="filterSavedBuilds('d4')" class="search-input">
        <ul id="my-builds-d4" class="dash-list my-builds-list"></ul>
    </div>
</div>
