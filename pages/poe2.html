<div class="poe2-sub-nav sub-tabs-container">
    <button class="poe2-sub-btn sub-tab-btn active-sub" onclick="openSubTab(event, 'poe2-dash', 'poe2')">📊 Dashboard</button>
    <button class="poe2-sub-btn sub-tab-btn" onclick="openSubTab(event, 'poe2-tools', 'poe2')">🧰 Strumenti</button>
    <button class="poe2-sub-btn sub-tab-btn" onclick="openSubTab(event, 'poe2-builds', 'poe2')">💾 Le Mie Build</button>
</div>

<div id="poe2-dash" class="poe2-sub-content active-sub-content">
    <div id="build-meta-poe2" class="build-meta-panel"></div>
    
    <div class="dash-grid">
        <div class="dash-card">
            <h3>🛡️ Top Build Endgame <span class="tag season-highlight">Caricamento...</span></h3>
            <ul id="top-builds-poe2" class="dash-list">
                <li><span style="color: var(--text-muted); font-style:italic;">In attesa di sincronizzazione...</span></li>
            </ul>
        </div>
        <div class="dash-card">
            <h3>🚀 Top Build Leveling <span class="tag season-highlight">Caricamento...</span></h3>
            <ul id="top-leveling-poe2" class="dash-list">
                <li><span style="color: var(--text-muted); font-style:italic;">In attesa di sincronizzazione...</span></li>
            </ul>
        </div>
    </div>
    
    <div id="build-discovery-poe2" class="build-discovery-panel"></div>
</div>

<div id="poe2-tools" class="poe2-sub-content" style="display:none;">
    <div class="tools-grid">
        <button class="tool-card" onclick="openOverlay('https://poe2db.tw', 'PoE 2 DB')">🌐 PoE 2 DB</button>
        <button class="tool-card" onclick="openOverlay('https://maxroll.gg/poe2', 'Maxroll PoE 2')">📖 Maxroll PoE 2</button>
    </div>
</div>

<div id="poe2-builds" class="poe2-sub-content" style="display:none;">
    <div class="my-builds-container">
        <h3>💾 Salva la tua Build PoE 2</h3>
        <form id="form-poe2" onsubmit="saveBuild(event, 'poe2')" class="build-form">
            <input type="text" id="name-poe2" placeholder="Nome Build" required>
            <input type="url" id="link-poe2" placeholder="Link Guida" required>
            <input type="text" id="version-poe2" placeholder="Versione">
            <input type="text" id="note-poe2" placeholder="Note">
            <div class="form-actions">
                <button type="submit" id="submit-btn-poe2" class="submit-btn">Salva</button>
                <button type="button" id="cancel-btn-poe2" class="cancel-btn" style="display:none;" onclick="cancelEdit('poe2')">Annulla</button>
            </div>
        </form>
        <input type="text" id="filter-saved-poe2" placeholder="🔍 Cerca tra le mie build..." onkeyup="filterSavedBuilds('poe2')" class="search-input">
        <ul id="my-builds-poe2" class="dash-list my-builds-list"></ul>
    </div>
</div>
