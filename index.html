<!DOCTYPE html>
<html data-theme="dark" lang="it">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="no-referrer" name="referrer"/>
    <!-- Tag necessari per la PWA -->
    <link rel="manifest" href="./manifest.webmanifest">
    <meta name="theme-color" content="#1e1e24">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./assets/arpg_hub_logo_v2.jpg">

    <title>ARPG Companion Hub - Edizione Ultimate</title>
    <link href="./assets/arpg_hub_logo_v2.jpg" rel="icon" type="image/jpeg"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;800&family=Crimson+Text:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@400;600&display=swap" rel="stylesheet">
    
    <link href="./css/style.css" rel="stylesheet" />
</head>
<body>
<!-- MODALS GLOBALI -->
<div class="modal" id="iframe-modal">
    <div class="modal-content"><div class="modal-header"><span class="modal-title" id="modal-title">ARPG Tools</span><span class="close-btn" onclick="window.closeOverlay()">×</span></div><iframe id="modal-iframe" loading="lazy" src=""></iframe></div>
</div>
<div class="modal" id="auth-modal">
    <div class="modal-content auth-box">
        <div class="modal-header"><span class="modal-title">Autenticazione Cloud</span><span class="close-btn" onclick="window.closeAuthModal()">×</span></div>
        <div style="padding: 20px; display: flex; flex-direction: column; gap: 15px;">
            <input class="auth-input" id="auth-email" placeholder="La tua Email" type="email"/>
            <input class="auth-input" id="auth-password" placeholder="La tua Password" type="password"/>
            <div style="display: flex; gap: 10px;"><button class="action-btn" onclick="window.loginWithEmail()" style="flex:1;">Accedi</button><button class="action-btn" onclick="window.registerWithEmail()" style="flex:1; background: var(--accent-tertiary);">Registrati</button></div>
            <div style="text-align: center; color: var(--text-muted);">— oppure —</div>
            <button class="action-btn" style="background:#fff; color:#111;" onclick="window.loginWithGoogle()">Accedi con Google</button>
        </div>
    </div>
</div>

<!-- HEADER E LINGUA FLUTTUANTE -->
<header class="essential-header">
    <div class="utility-language-floating" aria-label="Lingua del sito">
        <div id="google_translate_element"></div>
    </div>
    <div class="essential-header-shell">
        <div class="essential-brand">
    <img alt="ARPG Companion Hub" class="banner-img" fetchpriority="high" src="assets/arpg_hub_banner_v2.jpg"/>
</div>
    </div>
</header>

<a class="skip-link" href="#main-content">Vai ai contenuti</a>

<!-- TOOLBELT -->
<div class="hub-toolbelt" aria-label="Strumenti rapidi del Companion Hub">
    <button class="hub-tool-btn hub-tool-btn--accent" id="hub-search-btn" type="button">⌕ Cerca</button>
    <button class="hub-tool-btn" id="hub-season-btn" type="button">◈ La mia stagione</button>
    <button class="hub-tool-btn" id="hub-compare-btn" type="button">⇄ Confronta build</button>
    <button class="hub-tool-btn" id="hub-ranking-btn" type="button">📊 Classifica ARPG</button>
    <button class="hub-tool-btn" id="hub-patch-btn" type="button">▤ Registro patch</button>
    <button class="hub-tool-btn" id="hub-share-btn" type="button">↗ Condividi</button>
    
    <button class="hub-tool-btn" id="appearance-toggle" type="button">⚙ Aspetto</button>
    
    <a class="hub-tool-btn discord-tool-btn" href="https://discord.gg/wqywvBx" rel="noopener noreferrer" target="_blank" style="text-decoration: none;">
    <img alt="Discord" src="assets/logo_animated_v2.jpg" style="width: 18px; height: 18px; border-radius: 50%; object-fit: cover; vertical-align: middle; margin-right: 4px;"/> Discord
</a>
    
    <button class="hub-tool-btn" id="auth-btn" onclick="window.openAuthModal()">👤 Accedi al Cloud</button>
    
    <!-- Tasto per installare PWA su PC/Android -->
    <button class="hub-tool-btn hub-install-btn" id="hub-install-btn" type="button" hidden>⇩ Installa app</button>
</div>

<!-- TABS PRINCIPALI (ICONE CORRETTE) -->
<nav class="tabs" id="main-content" tabindex="-1">
    <button class="tab-btn active-btn" onclick="window.openMainTab(event, 'poe1', 'var(--accent-primary)')">
        <img alt="PoE 1" class="tab-icon" decoding="async" height="26" loading="lazy" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8hRJa3xGY_3AGhoIi0UWV1M0R2pR_Z7ikkRTdnCiSpw&amp;s=10" width="26"/> Path of Exile 1
    </button>
    <button class="tab-btn" onclick="window.openMainTab(event, 'poe2', 'var(--accent-primary)')">
        <img alt="PoE 2" class="tab-icon" decoding="async" height="26" loading="lazy" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlLULAvVSpii6ietytRcFICav9snB2sdbmrsuX3Y5Brw&amp;s=10" width="26"/> Path of Exile 2
    </button>
    <button class="tab-btn" onclick="window.openMainTab(event, 'le', 'var(--accent-le)')">
        <img alt="Last Epoch" class="tab-icon" decoding="async" height="26" loading="lazy" src="https://cdn2.steamgriddb.com/icon_thumb/1e8d0b1e07841cd90a347a8f26b41505.png" style="border-radius: 50%;" width="26"/> Last Epoch
    </button>
    <button class="tab-btn" onclick="window.openMainTab(event, 'd2', 'var(--danger)')">
        <img alt="D2R" class="tab-icon" decoding="async" height="26" loading="lazy" src="https://diablo2.io/favicon.ico" width="26"/> Diablo 2: Resurrected
    </button>
    <button class="tab-btn" onclick="window.openMainTab(event, 'd4', '#c0392b')">
        <img alt="Logo Diablo 4" class="tab-icon d4-logo" decoding="async" height="26" loading="eager" src="./assets/diablo4-logo.png" width="26"/> Diablo 4
    </button>
</nav>

<!-- CONTENITORE DINAMICO -->
<main id="game-content-container">
    <div style="text-align:center; padding: 50px; color: var(--text-muted);">Caricamento dati in corso...</div>
</main>

<footer class="main-footer">
    © 2026 Sairiin - ARPG Companion Hub<br/><a class="footer-link" href="mailto:giordani.claudio@gmail.com" style="margin-top:10px; display:inline-block;">Contattami per supporto</a>
</footer>

<!-- SCRIPT GOOGLE TRANSLATE -->
<script>
    function googleTranslateElementInit() {
        new google.translate.TranslateElement({pageLanguage: 'it', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
    }
</script>
<script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>

<!-- SCRIPT LOGICA E FIREBASE (Modulo Esterno) -->
<script type="module" src="js/main.js"></script>
</body>
</html>
