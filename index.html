<!DOCTYPE html>
<html data-theme="dark" lang="it">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <meta content="no-referrer" name="referrer"/>
    <title>ARPG Companion Hub - Edizione Ultimate</title>
    
    <link href="arpg_hub_logo_v2.jpg" rel="icon" type="image/jpeg"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link crossorigin="" href="https://www.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&display=swap" rel="stylesheet"/>
    
    <!-- IL NUOVO FILE CSS -->
    <link rel="stylesheet" href="css/style.css">

    <link rel="manifest" href="manifest.webmanifest">
    <meta name="theme-color" content="#ff9800">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="assets/pwa-icon-192.png">
    
    <!-- IL NUOVO FILE JS -->
    <script type="module" src="js/main.js" defer></script>
</head>
<body data-active-game="poe1">
    <!-- OVERLAY MODAL (iFrame) -->
    <div class="modal" id="iframe-modal">
        <div class="modal-content">
            <div class="modal-header">
                <span class="modal-title" id="modal-title">ARPG Tools Overlay</span>
                <span class="close-btn" onclick="window.closeOverlay()">×</span>
            </div>
            <iframe id="modal-iframe" loading="lazy" src="" title="Strumento ARPG esterno"></iframe>
        </div>
    </div>

    <!-- AUTH MODAL (Login/Registrazione) -->
    <div class="modal" id="auth-modal">
        <div class="modal-content auth-box">
            <div class="modal-header">
                <span class="modal-title">Autenticazione Cloud</span>
                <span class="close-btn" onclick="window.closeAuthModal()">×</span>
            </div>
            <div style="padding: 20px; display: flex; flex-direction: column; gap: 15px;">
                <input class="auth-input" id="auth-email" placeholder="La tua Email" type="email"/>
                <input class="auth-input" id="auth-password" placeholder="La tua Password" type="password"/>
                <div style="display: flex; gap: 10px;">
                    <button class="action-btn" onclick="window.loginWithEmail()" style="flex:1;">Accedi</button>
                    <button class="action-btn" onclick="window.registerWithEmail()" style="flex:1; background: var(--accent-tertiary);">Registrati</button>
                </div>
                <div style="text-align: center; color: var(--text-muted); margin: 10px 0;">— oppure —</div>
                <button class="auth-btn" onclick="window.loginWithGoogle()">
                    <svg style="width:18px;height:18px;margin-right:8px;" viewbox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"></path><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path></svg>
                    Accedi con Google
                </button>
            </div>
        </div>
    </div>

    <!-- HEADER & TOOLBELT -->
<header class="essential-header">
    <div class="essential-header-shell">
        <div class="essential-brand">
            <img alt="ARPG Companion Hub" class="banner-img" fetchpriority="high" src="arpg_hub_banner_v2.jpg"/>
        </div>
        <div class="essential-utilities" aria-label="Comandi del sito">
            <button class="auth-btn" id="auth-btn" onclick="window.openAuthModal()">👤 Accedi</button>
            <a class="discord-link" href="https://discord.gg/wqywvBx" rel="noopener noreferrer" target="_blank"><img alt="I Masochist" height="20" src="logo_animated_v2.jpg" style="width: 20px; height: 20px; border-radius: 50%; object-fit: cover;" width="20"/> Discord</a>
            <div class="utility-language" aria-label="Lingua del sito"><div id="google_translate_element"></div></div>
            <button aria-controls="appearance-panel" aria-expanded="false" class="utility-action" id="appearance-toggle" onclick="window.toggleAppearancePanel()" type="button">⚙ Aspetto</button>
        </div>

        <section aria-labelledby="appearance-title" class="appearance-panel" hidden id="appearance-panel" style="z-index: 999;">
            <div class="appearance-panel-heading"><div><h2 id="appearance-title">Aspetto</h2><p>Schema e dimensione del testo.</p></div><button aria-label="Chiudi impostazioni aspetto" class="panel-close-btn" onclick="window.closeEssentialPanel('appearance-panel', 'appearance-toggle')" type="button">×</button></div>
            <div class="appearance-grid">
                <button class="theme-btn" onclick="window.setTheme('dark')" title="Tema scuro" type="button">🌙 Scuro</button>
                <button class="theme-btn" onclick="window.setTheme('amoled')" title="Tema AMOLED" type="button">🖤 AMOLED</button>
                <button class="theme-btn" onclick="window.setTheme('light')" title="Tema chiaro" type="button">☀️ Chiaro</button>
                <button class="theme-btn appearance-font" onclick="window.changeFontSize(-1)" title="Riduci carattere" type="button">A− Testo</button>
                <button class="theme-btn appearance-font" onclick="window.changeFontSize(1)" title="Ingrandisci carattere" type="button">A+ Testo</button>
            </div>
            <p class="appearance-panel-note">Le preferenze restano salvate sul dispositivo.</p>
        </section>
    </div>
</header>

<a class="skip-link" href="#main-content">Vai ai contenuti</a>

<div class="hub-toolbelt" aria-label="Strumenti rapidi del Companion Hub">
    <button class="hub-tool-btn hub-tool-btn--accent" id="hub-search-btn" type="button" aria-keyshortcuts="Control+K Meta+K">⌕ Cerca <span aria-hidden="true">⌘K</span></button>
    <button class="hub-tool-btn" id="hub-season-btn" type="button">◈ La mia stagione</button>
    <button class="hub-tool-btn" id="hub-compare-btn" type="button">⇄ Confronta build</button>
    <button class="hub-tool-btn" id="hub-ranking-btn" type="button">📊 Classifica ARPG</button>
    <button class="hub-tool-btn" id="hub-patch-btn" type="button">▤ Registro patch</button>
    <button class="hub-tool-btn" id="hub-share-btn" type="button">↗ Condividi</button>
    <button class="hub-tool-btn hub-install-btn" id="hub-install-btn" type="button" hidden>⇩ Installa app</button>
</div>

    <!-- MAIN TABS (I Bottoni dei Giochi) -->
    <nav class="tabs" id="main-content" tabindex="-1">
        <button class="tab-btn active-btn" onclick="window.openMainTab(event, 'poe1', 'var(--accent-primary)')">
            <img alt="PoE 1" class="tab-icon" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQ8hRJa3xGY_3AGhoIi0UWV1M0R2pR_Z7ikkRTdnCiSpw&s=10" /> Path of Exile 1
        </button>
        <button class="tab-btn" onclick="window.openMainTab(event, 'poe2', 'var(--accent-primary)')">
            <img alt="PoE 2" class="tab-icon" src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQlLULAvVSpii6ietytRcFICav9snB2sdbmrsuX3Y5Brw&s=10" /> Path of Exile 2
        </button>
        <button class="tab-btn" onclick="window.openMainTab(event, 'le', 'var(--accent-le)')">
            <img alt="Last Epoch" class="tab-icon" src="https://cdn2.steamgriddb.com/icon_thumb/1e8d0b1e07841cd90a347a8f26b41505.png" style="border-radius: 50%;" /> Last Epoch
        </button>
        <button class="tab-btn" onclick="window.openMainTab(event, 'd2', 'var(--danger)')">
            <img alt="D2R" class="tab-icon" src="https://diablo2.io/favicon.ico" /> Diablo 2: Resurrected
        </button>
        <button class="tab-btn" onclick="window.openMainTab(event, 'd4', '#c0392b')">
            <img alt="Logo Diablo 4" class="tab-icon d4-logo" src="assets/diablo4-logo.png" /> Diablo 4
        </button>
    </nav>

<!-- CONTAINER DINAMICO DOVE VENGONO INIETTATI I FILE -->
    <main>
        <section id="game-content-container" class="tab-content active" style="display: block;">
            <!-- IL CONTENUTO DEI GIOCHI APPARIRÀ QUI -->
        </section>
    </main>

    <!-- FOOTER -->
    <footer class="main-footer">
        © 2026 Sairiin - ARPG Companion Hub<br/>
        <a class="footer-link" href="mailto:giordani.claudio@gmail.com" style="margin-top: 10px; display: inline-block;">Contattami per supporto</a>
    </footer>

    <!-- SCRIPT INLINE DI BASE -->
    <script>
        document.addEventListener("error", function(e) {
            if (e.target.tagName.toLowerCase() === 'img') {
                if (e.target.getAttribute('data-fallback-applied') === 'true') return;
                e.target.setAttribute('data-fallback-applied', 'true');
                e.target.src = 'https://placehold.co/100x100/1e1e24/ff9800?text=No+Image'; 
                e.target.style.objectFit = 'contain';
            }
        }, true);

        function googleTranslateElementInit() {
            new google.translate.TranslateElement({pageLanguage: 'it', layout: google.translate.TranslateElement.InlineLayout.SIMPLE}, 'google_translate_element');
        }
    </script>
    <script src="https://translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
